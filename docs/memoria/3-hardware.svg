<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="fin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ini" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#475569"/></marker></defs><rect width="1000" height="560" fill="#FFFFFF"/><rect x="80" y="60" width="300" height="330" rx="14" fill="#E8F1F8" stroke="#1F4E79" stroke-width="2"/><text x="100" y="92" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">Placa ESP32 (DevKit)</text><text x="100" y="116" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">MicroPython 1.29</text><text x="100" y="136" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">4 MB de flash · WiFi 2,4 GHz</text><text x="100" y="156" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">LED integrado en GPIO 2</text><rect x="110" y="190" width="150" height="120" rx="4" fill="#9CA3AF" stroke="#4B5563" stroke-width="1.2"/><text x="185" y="245" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">ESP32-WROOM</text><text x="185" y="263" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11" fill="#F3F4F6" text-anchor="middle">WiFi · 2 núcleos</text><rect x="620" y="130" width="270" height="230" rx="14" fill="#F3F4F6" stroke="#111827" stroke-width="2"/><text x="640" y="162" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">Módulo zumbador pasivo</text><text x="640" y="184" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">3 pines: S, central (+), −</text><circle cx="800" cy="270" r="44" fill="#111827"/><circle cx="800" cy="270" r="10" fill="#374151"/><rect x="380" y="209" width="14" height="12" rx="2" fill="#D1D5DB" stroke="#6B7280" stroke-width="1"/><text x="372" y="219" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F4E79" text-anchor="end">3V3</text><rect x="606" y="209" width="14" height="12" rx="2" fill="#D1D5DB" stroke="#6B7280" stroke-width="1"/><text x="628" y="219" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">+ (central)</text><polyline points="394,215 606,215" fill="none" stroke="#DC2626" stroke-width="3"/><rect x="480.1875" y="196.5" width="39.625" height="18.950000000000003" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="500" y="209.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="middle">3,3 V</text><rect x="380" y="259" width="14" height="12" rx="2" fill="#D1D5DB" stroke="#6B7280" stroke-width="1"/><text x="372" y="269" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F4E79" text-anchor="end">GPIO 33 (D33)</text><rect x="606" y="259" width="14" height="12" rx="2" fill="#D1D5DB" stroke="#6B7280" stroke-width="1"/><text x="628" y="269" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">S (señal)</text><polyline points="394,265 606,265" fill="none" stroke="#EA580C" stroke-width="3"/><rect x="458.05" y="246.5" width="83.9" height="18.950000000000003" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="500" y="259.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="middle">PWM: la nota</text><rect x="380" y="309" width="14" height="12" rx="2" fill="#D1D5DB" stroke="#6B7280" stroke-width="1"/><text x="372" y="319" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F4E79" text-anchor="end">GND</text><rect x="606" y="309" width="14" height="12" rx="2" fill="#D1D5DB" stroke="#6B7280" stroke-width="1"/><text x="628" y="319" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="start">− (masa)</text><polyline points="394,315 606,315" fill="none" stroke="#111827" stroke-width="3"/><rect x="483.35" y="296.5" width="33.3" height="18.950000000000003" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="500" y="309.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="middle">masa</text><rect x="195" y="390" width="70" height="22" rx="3" fill="#6B7280" stroke="#4B5563" stroke-width="1"/><text x="230" y="405" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">USB</text><polyline points="230,412 230,470" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="236" y="433.5" width="210.4" height="18.950000000000003" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="240" y="446.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="start">cable USB (CP2102, /dev/ttyUSB0)</text><rect x="110" y="470" width="240" height="62" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="124" y="496.85" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="start">PC del profesor</text><text x="124" y="519.85" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="start">instala el firmware y ve el log</text><rect x="450" y="410" width="500" height="122" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="468" y="436" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#374151" text-anchor="start">El zumbador suena con PWM: la frecuencia es la nota y el ciclo</text><text x="468" y="456" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#374151" text-anchor="start">de trabajo, 50 % (el volumen más alto de un zumbador pasivo).</text><text x="468" y="476" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#374151" text-anchor="start">Tiene una sola voz: un acorde llega como su frecuencia resultante.</text><text x="468" y="496" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#374151" text-anchor="start">Pitidos: C6-E6-G6 arranca, G6-C7 conectada, C7-G6 sin conexión.</text><text x="468" y="516" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#374151" text-anchor="start">El LED queda encendido mientras la placa está conectada al PC.</text></svg>