<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><marker id="fin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ini" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#475569"/></marker></defs><rect width="1200" height="760" fill="#FFFFFF"/><rect x="20" y="40" width="740" height="700" rx="14" fill="#EEF4FB" stroke="#A8C1DF" stroke-width="1.5"/><text x="38" y="66" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">AULA · ROUTER WIFI 2,4 GHZ (WPA2)</text><rect x="790" y="205" width="390" height="350" rx="14" fill="#F4F1FA" stroke="#C3B6E0" stroke-width="1.5"/><text x="808" y="231" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">INTERNET</text><rect x="790" y="575" width="390" height="165" rx="14" fill="#EEF7EE" stroke="#A9D3A9" stroke-width="1.5"/><text x="808" y="601" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">CASA</text><rect x="790" y="40" width="390" height="145" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="808" y="66" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="start">Cómo leer el diagrama</text><polyline points="810,90 850,90" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><text x="860" y="94" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="start">petición</text><polyline points="950,90 990,90" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)" marker-start="url(#ini)"/><text x="1000" y="94" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="start">en los dos sentidos</text><text x="808" y="122" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="start">Lo que cruza la WiFi o sale a internet va cifrado</text><text x="808" y="141" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="start">(HTTPS, WebSocket seguro, MQTT con TLS). Sin cifrar,</text><text x="808" y="160" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="start">solo dentro del PC: de nginx a la app y a Mosquitto.</text><rect x="45" y="110" width="230" height="96" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="59" y="144.75" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">Móviles del aula</text><text x="59" y="168.875" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">profesor y alumnos,</text><text x="59" y="187.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">en el navegador</text><rect x="335" y="90" width="400" height="490" rx="12" fill="#DDE8F5" stroke="#8FAED3" stroke-width="1.5"/><text x="355" y="118" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">PC del profesor (nodo fog)</text><text x="355" y="138" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">Linux · systemd: todo arranca solo</text><rect x="360" y="155" width="350" height="58" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="374" y="179.8125" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">nginx</text><text x="374" y="203.9375" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">HTTPS :443 · certificado Let&#x27;s Encrypt</text><rect x="360" y="235" width="350" height="210" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="374" y="259" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">Aplicación fog</text><text x="374" y="279" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">Python · FastAPI · :8080 (solo local)</text><text x="380" y="304" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#374151" text-anchor="start">• web estática y API REST (cuentas, melodías)</text><text x="380" y="324" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#374151" text-anchor="start">• clase en directo por WebSocket</text><text x="380" y="344" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#374151" text-anchor="start">• cola del zumbador</text><text x="380" y="364" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#374151" text-anchor="start">• enlace con la placa (MQTT)</text><text x="380" y="384" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#374151" text-anchor="start">• sincronización con Atlas</text><text x="380" y="404" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#374151" text-anchor="start">• actualizaciones desde GitHub</text><text x="380" y="424" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#374151" text-anchor="start">• DuckDNS y puente con Ably</text><rect x="360" y="470" width="350" height="88" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="374" y="500.75" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">Mosquitto</text><text x="374" y="524.875" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">broker MQTT · :1883 solo local</text><text x="374" y="543.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">:8883 con TLS para la placa · ACL</text><polyline points="535,213 535,235" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="544" y="216.5" width="71.25" height="18.950000000000003" rx="3" fill="#DDE8F5" stroke="#DDE8F5" stroke-width="0"/><text x="548" y="229.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="start">HTTP local</text><polyline points="535,447 535,468" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)" marker-start="url(#ini)"/><rect x="544" y="449.5" width="71.25" height="18.950000000000003" rx="3" fill="#DDE8F5" stroke="#DDE8F5" stroke-width="0"/><text x="548" y="462.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="start">MQTT :1883</text><rect x="45" y="440" width="230" height="120" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/><text x="59" y="468.625" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">Placa ESP32</text><text x="59" y="492.75" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">MicroPython 1.29</text><text x="59" y="510.875" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">MQTT con TLS</text><text x="59" y="529.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">almacén cifrado</text><text x="59" y="547.125" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" 