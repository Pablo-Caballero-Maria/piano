<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><defs><marker id="fin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ini" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#475569"/></marker></defs><rect width="1200" height="730" fill="#FFFFFF"/><text x="370" y="26" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">PC DEL PROFESOR · fog/updater.py</text><text x="880" y="26" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">PLACA ESP32 · esp32/ota.py, main.py</text><rect x="220" y="40" width="300" height="46" rx="23" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/><text x="370" y="68" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#1F2937" text-anchor="middle">Cada hora, si hay internet</text><polyline points="370,86 370,116" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="190.0" y="118" width="360" height="58" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="370" y="142.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">git fetch: ¿hay un commit nuevo en</text><text x="370" y="160.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">origin/main y el checkout está limpio?</text><polyline points="370,176 370,204" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><polyline points="190,147 172,147" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="20" y="123.0" width="150" height="48" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/><text x="95.0" y="144.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="middle">no: nada que</text><text x="95.0" y="161.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="middle">hacer</text><rect x="190.0" y="206" width="360" height="58" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="370" y="230.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">lo prueba en un worktree aparte:</text><text x="370" y="248.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">pytest, npm ci, Vitest y next build</text><polyline points="370,264 370,282" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><polygon points="370,282.0 460.0,320 370,358.0 280.0,320" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="370" y="324.375" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle">¿pasan todos?</text><polyline points="280,320 172,320" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="20" y="296.0" width="150" height="48" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/><text x="95.0" y="317.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="middle">no: sigue la</text><text x="95.0" y="334.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="middle">versión actual</text><polyline points="370,358 370,398" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="376" y="370.5" width="20.65" height="18.950000000000003" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="380" y="383.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="start">sí</text><rect x="190.0" y="400" width="360" height="58" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="370" y="424.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">avanza el checkout, uv sync, pone la</text><text x="370" y="442.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">web nueva y reinicia el servicio</text><polyline points="370,458 370,476" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><polygon points="370,476.0 470.0,514 370,552.0 270.0,514" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="370" y="518.375" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle">¿cambió el firmware?</text><polyline points="270,514 172,514" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="20" y="498.5" width="150" height="31" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/><text x="95.0" y="519.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="middle">no: fin</text><polyline points="370,552 370,592" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="376" y="564.5" width="20.65" height="18.950000000000003" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="380" y="577.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="start">sí</text><rect x="190.0" y="594" width="360" height="58" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="370" y="618.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">publica por MQTT piano/&lt;id&gt;/ota</text><text x="370" y="636.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">{&quot;sha&quot;: …, &quot;url&quot;: &quot;https://&lt;PC&gt;/board/&lt;sha&gt;&quot;}</text><polyline points="550,623 625,623 625,69 698,69" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="700.0" y="40" width="360" height="58" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/><text x="880" y="64.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">guarda la petición y reinicia en modo</text><text x="880" y="82.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">actualización (solo ota.py en memoria)</text><polyline points="880,98 880,126" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="700.0" y="128" width="360" height="74" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/><text x="880" y="151.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">baja manifest.json y los ficheros que</text><text x="880" y="169.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">cambian, por HTTPS; comprueba el hash</text><text x="880" y="187.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">git de cada uno</text><polyline points="880,202 880,230" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="700.0" y="232" width="360" height="58" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/><text x="880" y="256.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">ejecuta los tests de la placa</text><text x="880" y="274.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">sobre el código nuevo (/next)</text><polyline points="880,290 880,308" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><polygon points="880,308.0 960.0,346 880,384.0 800.0,346" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="880" y="350.375" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle">¿pasan?</text><polyline points="960,346 1048,346" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="1050" y="322.0" width="140" height="48" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/><text x="1120.0" y="343.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="middle">no: sigue la</text><text x="1120.0" y="360.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="middle">versión anterior</text><polyline points="880,384 880,424" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="886" y="396.5" width="20.65" height="18.950000000000003" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="890" y="409.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="start">sí</text><rect x="700.0" y="426" width="360" height="58" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/><text x="880" y="450.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">instala (la anterior pasa a /prev)</text><text x="880" y="468.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">y reinicia con la nueva</text><polyline points="880,484 880,502" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><polygon points="880,502.0 985.0,540 880,578.0 775.0,540" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="880" y="544.375" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle">¿conecta con el PC?</text><polyline points="985,540 1048,540" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="1050" y="516.0" width="140" height="48" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/><text x="1120.0" y="537.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="middle">3 fallos: vuelve</text><text x="1120.0" y="554.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="middle">a la de /prev</text><polyline points="880,578 880,618" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="886" y="590.5" width="20.65" height="18.950000000000003" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="890" y="603.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="start">sí</text><rect x="700.0" y="620" width="360" height="58" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/><text x="880" y="644.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">versión confirmada (mark_good)</text><text x="880" y="662.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="middle">y lo cuenta en piano/&lt;id&gt;/log</text></svg>