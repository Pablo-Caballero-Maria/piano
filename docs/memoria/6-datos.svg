<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><marker id="fin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ini" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#475569"/></marker></defs><rect width="1200" height="520" fill="#FFFFFF"/><rect x="40" y="70" width="260" height="150" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="56" y="102" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">Navegador</text><text x="56" y="128" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">La contraseña no sale del móvil:</text><text x="56" y="147" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">envía PBKDF2-SHA256 de ella.</text><text x="56" y="166" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">Guarda un token de sesión</text><text x="56" y="185" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">firmado (30 días).</text><rect x="400" y="70" width="340" height="150" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="416" y="102" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">PC del profesor</text><rect x="416" y="114" width="150" height="24" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="491" y="130.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">clave del sistema</text><text x="416" y="162" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">Sella cada registro con AES-256-GCM</text><text x="416" y="181" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">(la clave del registro va como dato</text><text x="416" y="200" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">asociado). Nombres: hash con clave.</text><rect x="400" y="350" width="340" height="125" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/><text x="416" y="382" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">Placa ESP32</text><text x="416" y="408" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">Guarda solo blobs sellados en su flash</text><text x="416" y="427" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">(btree /piano.db). Sin la clave,</text><text x="416" y="446" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">no puede leer cuentas ni melodías.</text><rect x="850" y="350" width="310" height="125" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="866" y="382" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">MongoDB Atlas</text><text x="866" y="408" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">Blobs sellados. En claro solo lo que</text><text x="866" y="427" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">piden las consultas: ids, dueño (hash),</text><text x="866" y="446" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">público, fecha y si se borró.</text><rect x="850" y="70" width="310" height="150" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="866" y="102" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">Vercel</text><rect x="866" y="114" width="150" height="24" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="941" y="130.5" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">clave del sistema</text><text x="866" y="162" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">La misma clave que los PC:</text><text x="866" y="181" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">abre los registros de Atlas</text><text x="866" y="200" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#4B5563" text-anchor="start">y firma los tokens de sesión.</text><polyline points="300,155 398,155" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)" marker-start="url(#ini)"/><rect x="313.375" y="127.5" width="71.25" height="33.900000000000006" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="349" y="140.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="middle">HTTPS</text><text x="349" y="154.95" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="middle">en el aula</text><polyline points="170,70 170,36 1005,36 1005,68" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)"/><rect x="511.2625" y="28.5" width="153.47500000000002" height="18.950000000000003" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="588" y="41.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="middle">en casa: HTTPS a Vercel</text><polyline points="570,220 570,348" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)" marker-start="url(#ini)"/><rect x="576" y="277.5" width="191.425" height="18.950000000000003" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="580" y="290.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="start">MQTT/TLS: solo blobs sellados</text><polyline points="740,190 800,190 800,412 848,412" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)" marker-start="url(#ini)"/><rect x="780.1875" y="287.5" width="39.625" height="33.900000000000006" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="800" y="300.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="middle">sync</text><text x="800" y="314.95" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="middle">(TLS)</text><polyline points="1005,220 1005,348" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#fin)" marker-start="url(#ini)"/><rect x="1011" y="277.5" width="26.975" height="18.950000000000003" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="1015" y="290.0" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#374151" text-anchor="start">TLS</text><text x="40" y="505" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="12" fill="#4B5563" text-anchor="start">Las sesiones las comprueba cualquier servidor con la clave: no hay tabla de sesiones.</text></svg>