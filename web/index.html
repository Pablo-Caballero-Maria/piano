<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>ESP32 Piano</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1e2127;
    --line: #333842;
    --text: #e9ebef;
    --muted: #9aa1ad;
    --accent: #4cc38a;
    --warn: #e5a54b;
    --err: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body {
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }

  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; margin-right: auto; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .status[data-state=connected] .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .status[data-state=connecting] .dot { background: var(--warn); animation: pulse 1s infinite alternate; }
  .status[data-state=error] .dot { background: var(--err); }
  @keyframes pulse { to { opacity: .3; } }

  button {
    font: inherit; font-size: 14px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer;
    touch-action: manipulation;
  }
  button:hover:not(:disabled) { border-color: #4a505c; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06140d; font-weight: 600; }
  button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }

  .notice { margin: 0 16px 8px; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 1.4;
    background: #2b2416; color: #f0d9ad; border: 1px solid #5a4a2a; }
  .notice[hidden] { display: none; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 0 16px 12px; flex-wrap: wrap; }
  .now { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 700; min-width: 7ch; margin-right: auto; }
  .now small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 6px; }
  .octave { display: flex; align-items: center; gap: 6px; }
  .octave span { font-size: 14px; color: var(--muted); min-width: 8ch; text-align: center; }
  .octave button { width: 40px; padding: 9px 0; }

  .wrap { flex: 1; min-height: 0; display: flex; align-items: flex-end; padding: 0 16px 16px; }
  .keyboard { position: relative; display: flex; width: 100%; height: 100%; max-height: 420px; touch-action: none; }
  .key { position: relative; }
  .white {
    flex: 1; margin: 0 1px; border-radius: 0 0 8px 8px;
    background: linear-gradient(#fdfcf9, #ecebe6); box-shadow: inset 0 -6px 0 #d3d1ca;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px;
    padding-bottom: 12px; color: #8a8a8a; font-size: 12px;
  }
  .white.c b { color: #333; }
  .white.down { background: linear-gradient(#e3f3ea, #c9e8d7); box-shadow: inset 0 -2px 0 #a9d3bc; }
  .white.sounding { background: linear-gradient(#bfe8d2, #8fd4b0); }
  .black {
    position: absolute; top: 0; height: 60%; transform: translateX(-50%); z-index: 2;
    border-radius: 0 0 6px 6px; background: linear-gradient(#2c2d33, #0d0e10);
    box-shadow: inset 0 -5px 0 #000, 0 3px 4px rgba(0,0,0,.5);
    display: flex; justify-content: center; align-items: flex-end; padding-bottom: 8px;
    color: #8f949c; font-size: 11px;
  }
  .black.down { background: linear-gradient(#2f6b50, #1c4835); box-shadow: inset 0 -2px 0 #000; }
  .black.sounding { background: linear-gradient(#3fa673, #2a7b54); }
  .kbd { display: none; font-family: ui-monospace, monospace; font-size: 11px; opacity: .8; }
  @media (hover: hover) and (pointer: fine) { .kbd { display: block; } }

  .hint { padding: 0 16px 10px; font-size: 13px; color: var(--muted); }
  @media (orientation: landscape), (pointer: fine) { .hint.rotate { display: none; } }
  @media not ((hover: hover) and (pointer: fine)) { .hint.keys { display: none; } }

  @media (max-height: 500px) {
    header { padding: 8px 16px; }
    .bar { padding-bottom: 8px; }
    .now { font-size: 22px; }
    .wrap { padding-bottom: 10px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>ESP32 Piano</h1>
    <div class="status" id="status" data-state="idle"><span class="dot"></span><span id="statusText">Not connected</span></div>
    <button class="primary" id="connect">Connect ESP32</button>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="bar">
    <div class="now" id="now">–</div>
    <div class="octave">
      <button id="octDown" aria-label="Octave down">−</button>
      <span id="range">C4</span>
      <button id="octUp" aria-label="Octave up">+</button>
    </div>
    <button id="sound" aria-pressed="false" title="Also play the notes on this device's speaker">🔈 Device sound</button>
  </div>

  <div class="hint keys">Keyboard: <b>A W S E D F T G Y H U J K…</b> play notes · <b>Z / X</b> change octave</div>
  <div class="hint rotate">Tip: turn your phone sideways for more keys.</div>

  <div class="wrap" id="wrap"><div class="keyboard" id="keyboard"></div></div>

<script>
  // Must match esp32/main.py
  const DEVICE_NAME = "ESP32-Piano";
  const SERVICE_UUID = "7a3e0001-5c2b-4f8e-9d61-3b2f1c9a8e10";
  const NOTE_UUID = "7a3e0002-5c2b-4f8e-9d61-3b2f1c9a8e10";

  const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  // Computer keys by physical position (works on any layout); index = semitones above the first C
  const KEYMAP = ["KeyA", "KeyW", "KeyS", "KeyE", "KeyD", "KeyF", "KeyT", "KeyG", "KeyY", "KeyH",
                  "KeyU", "KeyJ", "KeyK", "KeyO", "KeyL", "KeyP", "Semicolon", "Quote"];
  const MIN_OCTAVE = 1, MAX_OCTAVE = 6;

  const $ = (id) => document.getElementById(id);
  const kb = $("keyboard"), wrap = $("wrap");

  const isBlack = (m) => [1, 3, 6, 8, 10].includes(m % 12);
  const noteName = (m) => NAMES[m % 12] + (Math.floor(m / 12) - 1);
  const freqOf = (m) => Math.round(440 * 2 ** ((m - 69) / 12));

  let octave = 4;                 // the leftmost key is C<octave>
  const baseMidi = () => 12 * (octave + 1);
  let whiteCount = 0;
  const keyEls = new Map();       // midi -> key element
  let layoutMap = null;           // real key labels for the user's keyboard layout, if the browser tells us

  // ---- Notes held / sounding ------------------------------------------------
  // The buzzer can only play one note at a time, so the most recently pressed
  // held note sounds; releasing it falls back to the previous one still held.
  const held = [];                // midi notes in press order (duplicates allowed)
  const pointerNotes = new Map(); // pointerId -> midi (0 = not over a key)
  const keyNotes = new Map();     // KeyboardEvent.code -> midi
  let sounding = 0;

  // Drop the most recent press of note m from the held list
  function remove(m) {
    const i = held.lastIndexOf(m);
    if (i >= 0) held.splice(i, 1);
  }

  // Recompute which note sounds; highlight the keys and send/play it only if it changed
  function update() {
    const m = held.length ? held[held.length - 1] : 0;
    for (const [km, el] of keyEls) {
      el.classList.toggle("down", held.includes(km));
      el.classList.toggle("sounding", km === m);
    }
    if (m === sounding) return;
    sounding = m;
    const f = m ? freqOf(m) : 0;
    sendFreq(f);
    localTone(f);
    $("now").innerHTML = m ? `${noteName(m)}<small>${f} Hz</small>` : "–";
  }

  // Let go of every key (mouse, touch and computer keyboard)
  function releaseAll() {
    held.length = 0;
    pointerNotes.clear();
    keyNotes.clear();
    update();
  }

  // ---- Keyboard drawing -----------------------------------------------------
  // (Re)draw whiteCount white keys starting at C<octave>, plus the black keys between them
  function build() {
    releaseAll();
    kb.innerHTML = "";
    keyEls.clear();

    const base = baseMidi();
    const whites = [];
    for (let m = base; whites.length < whiteCount; m++) if (!isBlack(m)) whites.push(m);

    const label = (m) => {
      const code = KEYMAP[m - base];
      if (!code) return "";
      const k = layoutMap?.get(code) ?? { Semicolon: ";", Quote: "'" }[code] ?? code.slice(3);
      return `<span class="kbd">${k.toUpperCase()}</span>`;
    };

    whites.forEach((m, i) => {
      const w = document.createElement("div");
      w.className = "key white" + (m % 12 === 0 ? " c" : "");
      w.dataset.midi = m;
      w.innerHTML = `${label(m)}<b>${noteName(m)}</b>`;
      kb.append(w);
      keyEls.set(m, w);

      if (i < whites.length - 1 && isBlack(m + 1)) {
        const b = document.createElement("div");
        b.className = "key black";
        b.dataset.midi = m + 1;
        b.style.left = `${((i + 1) / whiteCount) * 100}%`;
        b.style.width = `${58 / whiteCount}%`;
        b.innerHTML = label(m + 1);
        kb.append(b);
        keyEls.set(m + 1, b);
      }
    });

    $("range").textContent = `${noteName(whites[0])}–${noteName(whites[whites.length - 1])}`;
    $("octDown").disabled = octave <= MIN_OCTAVE;
    $("octUp").disabled = octave >= MAX_OCTAVE;
  }

  // Pick how many white keys fit the screen (wider keys on touch screens)
  function fit() {
    const coarse = matchMedia("(pointer: coarse)").matches;
    const n = Math.max(7, Math.min(22, Math.floor(wrap.clientWidth / (coarse ? 44 : 52))));
    if (n !== whiteCount) { whiteCount = n; build(); }
  }

  // Move the keyboard d octaves up/down, within MIN_OCTAVE..MAX_OCTAVE
  function shiftOctave(d) {
    const o = Math.max(MIN_OCTAVE, Math.min(MAX_OCTAVE, octave + d));
    if (o !== octave) { octave = o; build(); }
  }

  new ResizeObserver(fit).observe(wrap);
  navigator.keyboard?.getLayoutMap?.().then((m) => { layoutMap = m; build(); }).catch(() => {});
  $("octDown").onclick = () => shiftOctave(-1);
  $("octUp").onclick = () => shiftOctave(1);

  // ---- Touch / mouse (multi-touch, slide across keys for glissando) ---------
  // MIDI note of the key under the screen point (x, y), or 0 if none
  function keyAt(x, y) {
    const el = document.elementFromPoint(x, y)?.closest(".key");
    return el && kb.contains(el) ? +el.dataset.midi : 0;
  }

  kb.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    kb.setPointerCapture(e.pointerId);
    unlockAudio();
    const m = keyAt(e.clientX, e.clientY);
    pointerNotes.set(e.pointerId, m);
    if (m) held.push(m);
    update();
  });

  kb.addEventListener("pointermove", (e) => {
    if (!pointerNotes.has(e.pointerId)) return;
    const m = keyAt(e.clientX, e.clientY);
    const old = pointerNotes.get(e.pointerId);
    if (m === old) return;
    pointerNotes.set(e.pointerId, m);
    if (old) remove(old);
    if (m) held.push(m);
    update();
  });

  // A finger lifted / mouse released: release the note that pointer was holding
  function pointerEnd(e) {
    if (!pointerNotes.has(e.pointerId)) return;
    const old = pointerNotes.get(e.pointerId);
    pointerNotes.delete(e.pointerId);
    if (old) remove(old);
    update();
  }
  for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) kb.addEventListener(t, pointerEnd);
  kb.addEventListener("contextmenu", (e) => e.preventDefault());

  // ---- Computer keyboard ----------------------------------------------------
  addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === "KeyZ" || e.code === "KeyX") {
      if (!e.repeat) shiftOctave(e.code === "KeyZ" ? -1 : 1);
      return;
    }
    const i = KEYMAP.indexOf(e.code);
    if (i < 0) return;
    e.preventDefault();
    if (e.repeat || keyNotes.has(e.code)) return;
    unlockAudio();
    const m = baseMidi() + i;
    keyNotes.set(e.code, m);
    held.push(m);
    update();
  });

  addEventListener("keyup", (e) => {
    if (!keyNotes.has(e.code)) return;
    remove(keyNotes.get(e.code));
    keyNotes.delete(e.code);
    update();
  });

  // Don't leave a note stuck on when the app loses focus
  addEventListener("blur", releaseAll);
  document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

  // ---- Bluetooth --------------------------------------------------------------
  let device = null, noteChar = null;

  // state: idle | connecting | connected | error (drives the status dot and the Connect button)
  function setStatus(state, text) {
    $("status").dataset.state = state;
    $("statusText").textContent = text;
    const btn = $("connect");
    btn.textContent = state === "connected" ? "Disconnect" : device ? "Reconnect" : "Connect ESP32";
    btn.classList.toggle("primary", state !== "connected");
    btn.disabled = state === "connecting";
  }

  // Pick the ESP32 (first time only), connect to its GATT server and find the note characteristic
  async function connect() {
    try {
      setStatus("connecting", "Connecting…");
      if (!device) {
        device = await navigator.bluetooth.requestDevice({
          filters: [{ name: DEVICE_NAME }, { services: [SERVICE_UUID] }],
          optionalServices: [SERVICE_UUID],
        });
        device.addEventListener("gattserverdisconnected", () => {
          noteChar = null;
          setStatus("idle", "Disconnected");
        });
      }
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      noteChar = await service.getCharacteristic(NOTE_UUID);
      setStatus("connected", `Connected to ${device.name || DEVICE_NAME}`);
      sendFreq(sounding ? freqOf(sounding) : 0);
    } catch (err) {
      noteChar = null;
      if (err.name === "NotFoundError" && !device) setStatus("idle", "Not connected"); // chooser cancelled
      else setStatus("error", `Couldn't connect: ${err.message}`);
    }
  }

  $("connect").onclick = () => {
    if (noteChar && device?.gatt.connected) device.gatt.disconnect();
    else connect();
  };

  // Only one GATT write can be in flight. While one is sending, keep just the
  // newest frequency: the buzzer only cares about the latest state, and this
  // keeps latency low instead of letting a backlog build up.
  let writing = false, queued = null;

  // Queue frequency f (Hz, 0 = silence) for the ESP32; no-op while disconnected
  function sendFreq(f) {
    if (!noteChar) return;
    queued = f;
    if (!writing) flush();
  }

  // Write queued frequencies one at a time until nothing newer is waiting
  async function flush() {
    writing = true;
    while (queued !== null && noteChar) {
      const f = queued;
      queued = null;
      const data = new Uint8Array([f & 0xff, f >> 8]); // uint16 little-endian, 0 = silence
      try {
        if (noteChar.properties.writeWithoutResponse) await noteChar.writeValueWithoutResponse(data);
        else await noteChar.writeValueWithResponse(data);
      } catch (err) {
        console.warn("BLE write failed", err);
      }
    }
    writing = false;
  }

  if (!navigator.bluetooth) {
    const n = $("notice");
    n.hidden = false;
    const linuxChrome = /Linux/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent) && /Chrome/.test(navigator.userAgent);
    n.innerHTML = !window.isSecureContext
      ? "Bluetooth needs a secure (https://) page. Open the published Vercel link instead of the local file."
      : linuxChrome
      ? "Chrome on Linux has Bluetooth turned off by default. Open <b>chrome://flags/#enable-web-bluetooth</b> " +
        "(or <b>#enable-experimental-web-platform-features</b>), set it to <b>Enabled</b> and relaunch Chrome. " +
        "BlueZ must be running (<code>systemctl status bluetooth</code>)."
      : "This browser can't use Bluetooth. Use <b>Chrome</b> or <b>Edge</b> on Android, Windows, macOS or Linux " +
        "(on iPhone/iPad, use the <b>Bluefy</b> app). You can still play here with device sound.";
    $("connect").disabled = true;
  }

  // ---- Optional sound on this device (square wave, like the buzzer) ---------
  let soundOn = false;
  try { soundOn = localStorage.getItem("piano-sound") === "1"; } catch {}
  let ctx = null, osc = null, gain = null;

  // Browsers only allow audio after a user gesture, so the oscillator is created on the first key press
  function unlockAudio() {
    if (!soundOn) return;
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      osc = ctx.createOscillator();
      osc.type = "square";
      gain = ctx.createGain();
      gain.gain.value = 0;
      osc.connect(gain).connect(ctx.destination);
      osc.start();
    }
    if (ctx.state === "suspended") ctx.resume();
  }

  // Play f Hz (0 = silence) on this device, with short ramps to avoid clicks
  function localTone(f) {
    if (!ctx) return;
    const t = ctx.currentTime;
    gain.gain.cancelScheduledValues(t);
    if (f && soundOn) {
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setTargetAtTime(0.06, t, 0.004);
    } else {
      gain.gain.setTargetAtTime(0, t, 0.01);
    }
  }

  // Show the Device sound toggle's current state
  function renderSound() {
    $("sound").setAttribute("aria-pressed", soundOn);
    $("sound").textContent = soundOn ? "🔊 Device sound" : "🔈 Device sound";
  }

  $("sound").onclick = () => {
    soundOn = !soundOn;
    try { localStorage.setItem("piano-sound", soundOn ? "1" : "0"); } catch {}
    if (soundOn) unlockAudio(); else localTone(0);
    renderSound();
  };

  renderSound();
  fit();
</script>
</body>
</html>
