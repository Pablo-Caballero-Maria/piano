[project]
name = "piano"
version = "1.3.0"
description = "Piano lessons with an ESP32 buzzer: a teacher PC (fog node), MQTT, MongoDB Atlas, Vercel and Ably"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.3",
    "cryptography>=44",
    "fastapi>=0.165.0",
    "httpx>=0.28",
    "pymongo>=4.20.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "amqtt>=0.12.2",
    "mpremote>=1.29.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]
# Node.js for the website (web/), pinned here so every teacher PC builds it the same way:
# `uv run --group web npm …` (fog/website.py). Not a default group: Vercel's Python function skips it.
web = [
    "nodejs-wheel>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "esp32", "tests/board", "tools/sim"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
# The shared core, the teacher's PC app, the Vercel function, the board's firmware (run on CPython
# through tools/sim) and the tools.
source = ["pianocore", "fog", "api", "esp32", "tools"]
branch = true

[tool.coverage.report]
skip_covered = true

[tool.ty.environment]
python-version = "3.12"
# Where the modules imported by name live, as in pytest's pythonpath (the board's firmware runs on
# CPython through tools/sim)
extra-paths = ["esp32", "tests/board", "tools/sim"]

[tool.ty.src]
# MicroPython code (the board and its tests): CPython's typeshed doesn't describe its modules
exclude = ["esp32/", "tests/board/"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode punctuation (…, →) in strings and comments is intended

[tool.ruff.lint.per-file-ignores]
# MicroPython code (the board and its tests): no f-string/typing modernisations it doesn't support
"esp32/**" = ["UP", "SIM", "B", "RUF"]
"tests/board/**" = ["UP", "SIM", "B", "RUF"]
