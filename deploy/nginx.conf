# nginx on the teacher's PC (installed as /etc/nginx/nginx.conf by deploy/setup.sh; the original
# is kept as nginx.conf.orig). It only terminates TLS for @DOMAIN@ and passes everything to the
# Python app (fog), which serves the website, the API, the class WebSocket and the board's
# update files: the repository lives in a private home folder nginx can't read.
worker_processes 1;
include modules.d/*.conf;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Plain http: redirects to https. Its Date header also sets the board's clock when the
    # classroom has no internet (TLS checks certificate dates; esp32/app.py set_clock()).
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        return 301 https://@DOMAIN@$request_uri;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name @DOMAIN@;

        ssl_certificate     /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:1m;
        add_header Strict-Transport-Security "max-age=31536000" always;

        gzip on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        client_max_body_size 64k;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;       # the class WebSocket (/ws)
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }
    }
}
