# The classroom's MQTT broker (installed as /etc/mosquitto/mosquitto.conf by deploy/setup.sh;
# the original is kept as mosquitto.conf.orig). See fog/board.py for the topics.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/piano.passwd
acl_file /etc/mosquitto/piano.acl
persistence false

# The teacher's PC app (fog), from this machine only
listener 1883 127.0.0.1

# The board(s), over the classroom WiFi: TLS with the Let's Encrypt certificate of @DOMAIN@
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
