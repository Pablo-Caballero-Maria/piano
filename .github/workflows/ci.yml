# Continuous integration: lint, types, unit and integration tests with coverage, the website's build
# and the end-to-end tests, on every push and pull request. (The teacher's PCs run their own copy of
# the tests before they update: see fog/updater.py.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: Python · lint and tests
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    services:
      # tests/core/test_mongo.py checks the Atlas repository against a real MongoDB.
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PIANO_TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: Ruff (formatting)
        run: uv run ruff format --check .
      - name: pytest with coverage (core, fog app, board firmware, MQTT integration, MongoDB)
        run: uv run pytest --cov --cov-report=term --cov-report=xml --cov-report=html -p no:cacheprovider
      - name: Coverage summary
        id: coverage
        run: |
          {
            echo "### Python coverage"
            echo
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
          echo "percent=$(uv run coverage report --format=total)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-python
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  web:
    name: Website · types, lint, tests and build
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Vitest with coverage
        run: npm run test:coverage
      - name: Coverage summary
        id: coverage
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (n, m) => `| ${n} | ${m.pct} % | ${m.covered} / ${m.total} |`;
            console.log(["### Website coverage", "", "| Metric | % | Covered |", "| --- | ---: | ---: |",
              row("Statements", t.statements), row("Branches", t.branches), row("Functions", t.functions), row("Lines", t.lines)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
          echo "percent=$(node -p 'Math.round(require("./coverage/coverage-summary.json").total.statements.pct)')" >> "$GITHUB_OUTPUT"
      - name: Static export (web/out)
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: web/out/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: web/coverage/
          retention-days: 14

  e2e:
    name: End to end · Playwright
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: web/out
      # The teacher's PC app with a simulated board serves the build; Playwright drives the runner's Chrome.
      - name: Playwright (several phones in one class)
        run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  badges:
    name: Coverage badges
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the coverage JSON on the badges branch
        env:
          PYTHON: ${{ needs.python.outputs.coverage }}
          WEB: ${{ needs.web.outputs.coverage }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          badge() {
            color=$(awk -v p="$2" 'BEGIN { print (p >= 90) ? "brightgreen" : (p >= 75) ? "green" : (p >= 60) ? "yellowgreen" : "orange" }')
            printf '{"schemaVersion":1,"label":"%s","message":"%s%%","color":"%s"}\n' "$1" "$2" "$color"
          }
          mkdir badges && cd badges
          badge "coverage (python)" "$PYTHON" > coverage-python.json
          badge "coverage (web)" "$WEB" > coverage-web.json
          # The branch only holds the badges: Vercel must not deploy it.
          printf '{"git":{"deploymentEnabled":false}}\n' > vercel.json
          git init -q -b badges
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Coverage: Python ${PYTHON} %, web ${WEB} %"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
